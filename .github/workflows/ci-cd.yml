name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the jobs only check out code. Deploys use their own secrets (Vercel token,
# Render deploy hook), not the GITHUB_TOKEN.
permissions:
  contents: read

# CI runs: a newer push to the same feature branch / PR cancels the older run. Runs on main
# are never cancelled (the deploy jobs also have their own non-cancelling groups below).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # -----------------------------------------------------------
  # 1. Backend CI: Install dependencies & run Jest test suite
  # -----------------------------------------------------------
  backend-ci:
    name: Backend CI (Test & Validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # Fails only on high/critical advisories in production dependencies; moderate/low are
      # listed in the log but do not fail the job.
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Run test suite (Jest + Supertest + in-memory MongoDB replica set)
        run: npm test
        env:
          CI: true
          NODE_ENV: test
          # Keep the MongoDB binary outside node_modules so actions/cache can reuse it
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
          JWT_SECRET: ci-test-secret

  # -----------------------------------------------------------
  # 2. Frontend CI: Linting & Production Build
  # -----------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Fails only on high/critical advisories in production dependencies; moderate/low are
      # listed in the log but do not fail the job.
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Build frontend production bundle
        run: npm run build
        env:
          # Required: vite.config.js fails a production build without VITE_API_URL. CI has no
          # real backend, so a same-origin placeholder is used when the secret is not set.
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # -----------------------------------------------------------
  # 2b. End-to-end tests: Playwright (Chromium) against the real
  #     backend on an in-memory MongoDB (no real database/secrets)
  # -----------------------------------------------------------
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # Keep the MongoDB binary outside node_modules so actions/cache can reuse it
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (browser restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # -----------------------------------------------------------
  # 3. Continuous Deployment: Frontend (Vercel)
  # -----------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: [backend-ci, frontend-ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A deploy is never cancelled half-way; a newer one waits for the running one.
    concurrency:
      group: deploy-frontend-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: env.HAS_VERCEL_TOKEN == 'true'
        # Third-party action pinned to a full commit SHA (= tag v25 / v25.2.0), so a moved tag
        # cannot run new code with the Vercel token.
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}

      - name: Notice if Vercel Token is not configured
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: |
          echo "::notice title=Vercel CD Info::VERCEL_TOKEN secret is not yet configured in GitHub repository secrets. To enable automatic Vercel production deployment, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under Repository Settings -> Secrets and variables -> Actions."
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}

  # -----------------------------------------------------------
  # 4. Continuous Deployment: Backend (Render / Railway / Webhook)
  # -----------------------------------------------------------
  deploy-backend:
    name: Deploy Backend (Render / Railway Webhook)
    needs: [backend-ci, frontend-ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A deploy is never cancelled half-way; a newer one waits for the running one.
    # Render Auto-Deploy must be OFF so this hook (sent only after CI passes) is the only
    # deploy path (docs/OPERATIONS.md).
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Trigger Render Deploy Webhook
        if: env.HAS_RENDER_HOOK == 'true'
        run: |
          echo "Triggering Render backend deployment hook..."
          curl -sS -X POST -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment trigger sent successfully."
        env:
          HAS_RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}

      - name: Notice if Backend Deploy Hook is not configured
        if: env.HAS_RENDER_HOOK != 'true'
        run: |
          echo "::notice title=Backend CD Info::RENDER_DEPLOY_HOOK_URL secret is not yet configured. To enable automatic backend deployment on Render/Railway, add RENDER_DEPLOY_HOOK_URL under Repository Settings -> Secrets and variables -> Actions."
        env:
          HAS_RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
